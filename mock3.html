<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam - Mock 2 Paper Bank</title>
  <link rel="icon" type="image/x-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexampure.jpg">
  <!-- Immediate Auth Check - Runs BEFORE page renders -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged,
      signOut 
    } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDV-pbFNyXTS6LMuzvSKbZnGysPOrZldcc",
      authDomain: "igc-hk.firebaseapp.com",
      projectId: "igc-hk",
      storageBucket: "igc-hk.firebasestorage.app",
      messagingSenderId: "1021412241243",
      appId: "1:1021412241243:web:f5cb650b2ad46fafa7f47e",
      measurementId: "G-EYW84F5CSY"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Check authentication state IMMEDIATELY
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // User is not signed in, redirect to login page IMMEDIATELY
        window.location.replace("index.html");
      } else {
        // User is signed in
        console.log("User is logged in:", user.email);
        // Mark page as authenticated and remove overlay
        document.body.classList.add('authenticated');
        const authOverlay = document.getElementById('auth-overlay');
        if (authOverlay) {
          authOverlay.style.display = 'none';
        }
        // Update navbar with user info
        updateNavbarWithUser(user.email);
      }
    });

    // Add user info to navbar
    function updateNavbarWithUser(email) {
      const navbar = document.querySelector('.navbar');
      if (navbar && !document.querySelector('.user-info')) {
        const userDiv = document.createElement('div');
        userDiv.className = 'user-info';
        userDiv.innerHTML = `
          <span style="color: #666; font-size: 14px; margin-right: 10px;">${email}</span>
          <button onclick="logout()" style="
            background: #ff5722;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
          ">Logout</button>
        `;
        navbar.appendChild(userDiv);
      }
    }

    // Make logout function globally available
    window.logout = async function() {
      try {
        await signOut(auth);
        // Redirect happens automatically via onAuthStateChanged
      } catch (error) {
        console.error('Logout error:', error);
      }
    };
  </script>
  
  <style>
    :root {
      --bg: #fff8f0;
      --card: #fff5e6;
      --muted: #666666;
      --accent: #2196f3;
      --physics: #ff5722;
      --chemistry: #4caf50;
      --biology: #9c27b0;
      --maths: #0077cc;
      --radius: 12px;
      font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial;
    }

    /* ===== SECURITY OVERLAY ===== */
    #auth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      text-align: center;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    .auth-spinner {
      border: 4px solid rgba(255, 87, 34, 0.2);
      border-top: 4px solid #ff5722;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .auth-loading-text {
      color: #333;
      font-weight: 500;
      font-size: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide main content until authenticated */
    body:not(.authenticated) #main-content {
      display: none;
    }

    body.authenticated #auth-overlay {
      display: none;
    }
    /* ===== END SECURITY OVERLAY ===== */

    body {
      margin: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333;
      box-sizing: border-box; /* FIX: Apply to entire page */
    }

    /* Navbar */
    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }
    .nav-title {
      font-weight: 600;
      color: #333;
    }
    
    /* User Info in Navbar */
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Layout */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }
    .wrap {
      background: rgba(255,255,255,0.65);
      padding: 28px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      box-sizing: border-box; /* FIX: Critical fix for container */
    }

    /* Header */
    header {
      display: flex;
      gap: 16px;
      align-items: center;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #7c4dff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    /* Instructions */
    .instructions {
      background: var(--card);
      border-left: 4px solid var(--accent);
      padding: 18px;
      margin: 20px 0;
      border-radius: 12px;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    /* Grid 4 Columns */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    /* Subject Cards - FIXED: Added proper box sizing */
    .subject-card {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.05);
      box-sizing: border-box; /* FIX: Critical fix for cards */
      width: 100%;
    }

    .subject-header {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    .subject-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    .physics-icon { background: var(--physics); }
    .chemistry-icon { background: var(--chemistry); }
    .biology-icon { background: var(--biology); }
    .maths-icon { background: var(--maths); }

    /* Vertical Buttons - FIXED: Proper width calculation */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box; /* FIX: Ensure proper box model */
      width: 100%;
    }

    .links a {
      display: block;
      width: 100%;
      padding: 12px 14px;
      text-decoration: none;
      background: white;
      border-radius: 10px;
      border: 1px solid rgba(33,150,243,0.2);
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
      box-sizing: border-box; /* FIX: Critical fix - buttons now fit */
    }

    .links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }

    /* Text content in links section */
    .links p {
      margin: 8px 0 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    /* Mock 1 Button - FIXED: Proper width calculation */
    .mock1-button {
      text-align: center;
      margin-top: 40px;
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    .mock1-button a {
      text-decoration: none;
      background: var(--accent);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s;
      display: inline-block; /* FIX: Better for button styling */
      box-sizing: border-box; /* FIX: Ensure proper box model */
    }

    .mock1-button a:hover {
      opacity: 0.85;
    }

    /* Responsive fixes */
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .container {
        padding: 20px;
      }
      
      .wrap {
        padding: 20px;
      }
    }
    
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      
      .container {
        padding: 15px;
      }
      
      .wrap {
        padding: 15px;
      }
      
      .subject-card {
        padding: 15px;
      }
      
      .links a {
        padding: 10px 12px;
        font-size: 12px;
      }
      
      .navbar {
        padding: 10px 15px;
      }
      
      .mock1-button {
        margin-top: 30px;
      }
      
      .mock1-button a {
        padding: 10px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <!-- SECURITY OVERLAY - Blocks ALL interaction until auth verified -->
  <div id="auth-overlay">
    <div class="auth-spinner"></div>
    <div class="auth-loading-text">Verifying authorization...</div>
  </div>

  <!-- Main Content (Hidden until authenticated) -->
  <div id="main-content">
    <nav class="navbar">
      <a href="https://ccoex.igchkshop.dpdns.org" class="nav-logo">
        <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
        <span class="nav-title">IGC HK Exam</span>
      </a>
      <!-- User info will be added here by JavaScript -->
    
</body>
</html>
