<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }

  .box {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }

  h1 {
    font-size: 48px;
    margin-bottom: 10px;
  }

  p {
    color: #666;
  }

  a {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 20px;
    background: #2196f3;
    color: white;
    text-decoration: none;
    border-radius: 8px;
  }
</style>
</head>

<body>

<div class="box">
  <h1>404</h1>
  <p>Oops! This page does not exist.</p>
  <a href="/">Go back to Home</a>
</div>

</body>
</html>
