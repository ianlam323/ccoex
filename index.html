<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- Instant redirect - no delay -->
    <meta http-equiv="refresh" content="0; url=https://ccoex.igchkshop.dpdns.org/mock2.html">
    
    <!-- For better compatibility and immediate redirect -->
    <script>
        // Immediate JavaScript redirect as primary method
        window.location.replace("https://ccoex.igchkshop.dpdns.org/mock2.html");
        
        // Backup in case JavaScript is blocked
        setTimeout(function() {
            window.location.href = "https://ccoex.igchkshop.dpdns.org/mock2.html";
        }, 10);
    </script>
    
    <!-- Fallback for browsers that don't support JavaScript -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://ccoex.igchkshop.dpdns.org/mock2.html">
    </noscript>
    
    <style>
        /* Minimal styling just in case redirect is delayed */
        * {
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .redirect-message {
            text-align: center;
            color: #333;
            max-width: 500px;
            padding: 20px;
        }
        
        .redirect-message a {
            color: #0066cc;
            text-decoration: none;
        }
        
        .redirect-message a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Fallback content in case redirect doesn't work immediately -->
    <div class="redirect-message">
        <h2>Redirecting...</h2>
        <p>You are being redirected to: <strong>https://ccoex.igchkshop.dpdns.org/mock2.html</strong></p>
        <p>If you are not redirected automatically, please <a href="https://ccoex.igchkshop.dpdns.org/mock2.html">click here</a>.</p>
    </div>
    
    <!-- Additional JavaScript for instant redirect -->
    <script>
        // One more immediate redirect attempt
        if (!window.location.href.includes('mock2.html')) {
            window.location.href = "https://ccoex.igchkshop.dpdns.org/mock2.html";
        }
    </script>
</body>
</html>
