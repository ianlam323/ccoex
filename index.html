<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam - Announcement</title>
  <link rel="icon" type="image/x-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexampure.jpg">

  <style>
    :root {
      --bg: #fff8f0;
      --card: #fff5e6;
      --muted: #666666;
      --accent: #2196f3;
      --u5: #FF0000;
      --physics: #ff5722;
      --chemistry: #4caf50;
      --biology: #9c27b0;
      --maths: #0077cc;
      --radius: 12px;
      font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333;
      box-sizing: border-box;
    }

    /* Navbar */
    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-sizing: border-box;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }

    .nav-title {
      font-weight: 600;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 28px;
      box-sizing: border-box;
    }

    .wrap {
      background: rgba(255,255,255,0.65);
      padding: 40px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      box-sizing: border-box;
      text-align: center;
    }

    header {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent), #7c4dff);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      font-size: 18px;
    }

    h1 {
      font-size: 28px;
      margin: 0;
    }

    .announcement {
      background: var(--card);
      border-left: 5px solid var(--accent);
      padding: 25px;
      margin-top: 25px;
      border-radius: 12px;
      font-size: 16px;
      line-height: 1.6;
    }

    .announcement strong {
      color: var(--accent);
    }

    footer {
      margin-top: 40px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="#" class="nav-logo">
      <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
      <span class="nav-title">IGC HK Exam</span>
    </a>
  </nav>

  <div class="container">
    <div class="wrap">

      <header>
        <div class="logo">IGC</div>
        <h1>Announcement</h1>
      </header>

      <div class="announcement">
        <p>
          <strong>IGC HK Exam is currently refurbishing due to copyright issues.</strong>
        </p>
        <p>
          Please come back later to check out our new update.
        </p>
        <p>
          We appreciate your patience and support.
        </p>
      </div>

      <footer>
        © IGC HK Exam
      </footer>

    </div>
  </div>

</body>
</html>
