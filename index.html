<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam - Home</title>
  <link rel="icon" type="image/x-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexampure.jpg">

  <style>
    :root {
      --bg: #fff8f0;
      --card: #fff5e6;
      --accent: #2196f3;
      --radius: 12px;
      font-family: Inter, Roboto, system-ui;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333;
    }

    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      padding: 12px 24px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }

    .wrap {
      background: rgba(255,255,255,0.7);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .main-logo {
      width: 50px;
      height: 50px;
      border-radius: 8px;
    }

    h1 {
      margin: 0;
    }

    p {
      margin-bottom: 30px;
      color: #555;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .buttons a {
      padding: 14px;
      text-decoration: none;
      background: white;
      border-radius: 10px;
      border: 1px solid rgba(33,150,243,0.3);
      color: var(--accent);
      font-weight: 600;
      transition: 0.2s;
    }

    .buttons a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }
    
    /* Style for the last updated section */
    .update-info {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.1);
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="#" class="nav-logo">
      <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" alt="Logo">
      <span>IGC HK Exam</span>
    </a>
  </nav>

  <div class="container">
    <div class="wrap">

      <header>
        <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" class="main-logo" alt="Main Logo">
        <h1>Welcome to IGC HK Exam</h1>
      </header>

      <p>Select a section below to begin your revision.</p>

      <div class="buttons">
        <a href="https://ccoex.igchkshop.dpdns.org/mock1.html">Go to Mock 1</a>
        <a href="https://ccoex.igchkshop.dpdns.org/mock2.html">Go to Mock 2</a>
        <a href="https://ccoex.igchkshop.dpdns.org/mock3.html">Go to Mock 3</a>
        <a href="#">Unit 5 Biology (Under Construction)</a>
        <a href="#">Unit 5 Chemistry (Under Construction)</a>
      </div>

      <!-- INSTRUCTION COMMENT: To make these buttons functional, replace the href="#"
           with the actual URLs:
           - For Chemistry: href="https://ccoex.igchkshop.dpdns.org/u5chem"
           - For Biology: href="https://ccoex.igchkshop.dpdns.org/u5bio"
           Example: <a href="https://ccoex.igchkshop.dpdns.org/u5chem">Unit 5 Chemistry</a> -->

      <!-- Display latest update time from GitHub -->
      <div class="update-info">
        <p>📅 Last updated: <span id="last-update">Loading...</span></p>
      </div>

    </div>
  </div>

  <script>
    // Fetch the latest commit date from GitHub API
    async function getLastUpdateTime() {
      try {
        const response = await fetch('https://api.github.com/repos/ianlam323/ccoex/commits?per_page=1');
        const commits = await response.json();
        
        if (commits && commits[0] && commits[0].commit) {
          const lastUpdate = new Date(commits[0].commit.committer.date);
          
          // Format the date nicely according to user's local timezone
          const formattedDate = lastUpdate.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
          
          const formattedTime = lastUpdate.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit'
          });
          
          document.getElementById('last-update').innerHTML = `${formattedDate} at ${formattedTime}`;
          
          // Also add the commit message as a tooltip
          const commitMsg = commits[0].commit.message;
          document.getElementById('last-update').parentElement.title = `Latest commit: ${commitMsg}`;
        } else {
          // Fallback to April 1, 2026 12:00 AM in user's local timezone
          const fallbackDate = new Date(2026, 3, 1, 0, 0, 0); // Note: month is 0-indexed (3 = April)
          const formattedDate = fallbackDate.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
          const formattedTime = fallbackDate.toLocaleTimeString('en-US', {
            hour: '2-digit',
            minute: '2-digit'
          });
          document.getElementById('last-update').innerHTML = `${formattedDate} at ${formattedTime}`;
        }
      } catch (error) {
        // Fallback to April 1, 2026 12:00 AM in user's local timezone
        const fallbackDate = new Date(2026, 3, 1, 0, 0, 0);
        const formattedDate = fallbackDate.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
        const formattedTime = fallbackDate.toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit'
        });
        document.getElementById('last-update').innerHTML = `${formattedDate} at ${formattedTime}`;
        console.log('Could not fetch GitHub data:', error);
      }
    }
    
    // Call the function when page loads
    getLastUpdateTime();
  </script>

</body>
</html>
