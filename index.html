<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam | Login</title>
  <link rel="icon" type="image/x-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
  <link rel="apple-touch-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
  
  <style>
    :root {
      --bg: #fff8f0;
      --card: #fff5e6;
      --muted: #666666;
      --accent: #2196f3;
      --physics: #ff5722;
      --chemistry: #4caf50;
      --biology: #9c27b0;
      --maths: #0077cc;
      --radius: 12px;
      font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }
    .nav-title {
      font-weight: 600;
      color: #333;
    }

    /* Login Container */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
    }

    .login-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    /* ===== MODIFICATION 1: Updated Logo ===== */
    .logo-image {
      width: 100px; /* Adjust size as needed */
      height: auto;
      margin: 0 auto 20px;
      display: block;
      border-radius: 10px;
    }

    .login-header h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .login-header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      font-size: 15px;
      background: white;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #7c4dff);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Error Message */
    .error-message {
      background: rgba(255, 87, 34, 0.1);
      color: #ff5722;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      border: 1px solid rgba(255, 87, 34, 0.2);
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* Loading Spinner */
    .loading {
      display: none;
      text-align: center;
      margin-bottom: 20px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid rgba(33, 150, 243, 0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .login-card {
        padding: 30px 20px;
      }
      
      .login-header h1 {
        font-size: 24px;
      }
      
      .logo-image {
        width: 80px;
      }
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="https://ccoex.igchkshop.dpdns.org" class="nav-logo">
      <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
      <span class="nav-title">IGC HK Exam</span>
    </a>
  </nav>

  <!-- Login Form -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <!-- ===== MODIFICATION 1: Logo Image ===== -->
        <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" alt="IGC HK Exam Logo" class="logo-image">
        
        <!-- ===== MODIFICATION 2: Updated Heading ===== -->
        <h1>Welcome to IGC HK Exam - WJEC</h1>
        
        <!-- ===== MODIFICATION 3: Updated Description ===== -->
        <p>Sign in to access exam resources. IGC HK Exam is only available by invitation only.</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
      
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Signing in...</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="Enter your email" 
            required
            autocomplete="username"
          >
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter your password" 
            required
            autocomplete="current-password"
          >
        </div>
        
        <button type="submit" class="login-btn" id="loginBtn">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase Authentication -->
  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
    
    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDV-pbFNyXTS6LMuzvSKbZnGysPOrZldcc",
      authDomain: "igc-hk.firebaseapp.com",
      projectId: "igc-hk",
      storageBucket: "igc-hk.firebasestorage.app",
      messagingSenderId: "1021412241243",
      appId: "1:1021412241243:web:f5cb650b2ad46fafa7f47e",
      measurementId: "G-EYW84F5CSY"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    // Check if user is already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // ===== MODIFICATION 4: Redirect to mock2 instead of mock1 =====
        window.location.href = "mock2.html"; // Changed from mock1.html
      }
    });
    
    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorMessage = document.getElementById('errorMessage');
      const loading = document.getElementById('loading');
      
      // Reset error message
      errorMessage.textContent = '';
      errorMessage.classList.remove('show');
      
      // Show loading state
      loginBtn.disabled = true;
      loading.classList.add('show');
      
      try {
        // Sign in with Firebase
        await signInWithEmailAndPassword(auth, email, password);
        
        // Success - redirect will happen automatically via auth state listener
        
      } catch (error) {
        // Handle errors
        loading.classList.remove('show');
        loginBtn.disabled = false;
        
        let message = 'Login failed. Please try again.';
        
        switch(error.code) {
          case 'auth/user-not-found':
            message = 'No account found with this email.';
            break;
          case 'auth/wrong-password':
            message = 'Incorrect password. Please try again.';
            break;
          case 'auth/invalid-email':
            message = 'Invalid email address.';
            break;
          case 'auth/user-disabled':
            message = 'This account has been disabled.';
            break;
          case 'auth/too-many-requests':
            message = 'Too many failed attempts. Please try again later.';
            break;
          case 'auth/network-request-failed':
            message = 'Network error. Please check your connection.';
            break;
        }
        
        errorMessage.textContent = message;
        errorMessage.classList.add('show');
        
        // Clear password field
        document.getElementById('password').value = '';
      }
    });
    
    // Auto-focus email field on page load
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('email').focus();
    });
    
    // Enter key support
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
