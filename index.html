<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Update | IGC HK Exam</title>
  
  <!-- ========== FIREBASE AUTHENTICATION (REQUIRED) ========== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged,
      signOut,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDV-pbFNyXTS6LMuzvSKbZnGysPOrZldcc",
      authDomain: "igc-hk.firebaseapp.com",
      projectId: "igc-hk",
      storageBucket: "igc-hk.firebasestorage.app",
      messagingSenderId: "1021412241243",
      appId: "1:1021412241243:web:f5cb650b2ad46fafa7f47e",
      measurementId: "G-EYW84F5CSY"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    setPersistence(auth, browserLocalPersistence);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.replace("index.html");
      } else {
        const authOverlay = document.getElementById('auth-overlay');
        if (authOverlay) authOverlay.style.display = 'none';
        document.body.classList.add('authenticated');
        updateNavbarWithUser(user.email);
      }
    });

    function updateNavbarWithUser(email) {
      const navbar = document.querySelector('.navbar');
      if (navbar && !document.querySelector('.user-info')) {
        const userDiv = document.createElement('div');
        userDiv.className = 'user-info';
        userDiv.innerHTML = `
          <span style="color:#666;font-size:14px;margin-right:10px;">${email}</span>
          <button onclick="logout()" style="
            background:#ff5722;color:white;border:none;
            padding:6px 12px;border-radius:5px;
            font-size:12px;cursor:pointer;">Logout</button>
        `;
        navbar.appendChild(userDiv);
      }
    }

    window.logout = async function() {
      await signOut(auth);
    };
  </script>

  <style>
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      text-align: center;
    }

    .auth-spinner {
      border: 4px solid rgba(255,87,34,0.2);
      border-top: 4px solid #ff5722;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    body:not(.authenticated) #main-content { display: none; }
    body.authenticated #auth-overlay { display: none; }

    :root {
      --accent:#2196f3;
      --muted:#666;
      font-family: Inter, system-ui, -apple-system;
    }

    body {
      margin:0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color:#333;
    }

    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 28px;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .nav-logo {
      display:flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
    }

    .nav-logo img {
      width:36px;
      height:36px;
      border-radius:6px;
    }

    .container {
      max-width:900px;
      margin:0 auto;
      padding:28px;
    }

    .wrap {
      background: rgba(255,255,255,0.7);
      padding:32px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .page-header {
      display:flex;
      gap:16px;
      align-items:center;
      margin-bottom:20px;
    }

    .page-logo {
      width:56px;
      height:56px;
      border-radius:12px;
      background:linear-gradient(135deg,#ff5722,#ff9800);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:700;
    }

    h1 { margin:0; font-size:24px; }
    .page-description { color:var(--muted); font-size:14px; }

    .notice {
      background:#fff3e0;
      border-left:5px solid #ff9800;
      padding:18px;
      border-radius:10px;
      font-size:15px;
      line-height:1.6;
    }
  </style>
</head>

<body>
  <div id="auth-overlay">
    <div class="auth-spinner"></div>
    <div>Verifying authorization…</div>
  </div>

  <div id="main-content">
    <nav class="navbar">
      <a href="https://www.igchkshop.dpdns.org" class="nav-logo">
        <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" alt="IGC HK Exam">
        <span>IGC HK Exam</span>
      </a>
    </nav>

    <div class="container">
      <div class="wrap">
        <div class="page-header">
          <div class="page-logo">INFO</div>
          <div>
            <h1>Service Update</h1>
            <p class="page-description">IGC HK Exam Mock Services</p>
          </div>
        </div>

        <div class="notice">
          <strong>IGC HK Exam Mock 3 Service Notice</strong><br><br>
          IGC HK Exam Mock 3 service will resume soon.  
          Please check our website and social media platforms for any new updates.
        </div>

      </div>
    </div>
  </div>
</body>
</html>
