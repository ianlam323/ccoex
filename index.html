<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam - Home</title>
  <link rel="icon" type="image/x-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexampure.jpg">

  <style>
    :root {
      --bg: #fff8f0;
      --card: #fff5e6;
      --accent: #2196f3;
      --radius: 12px;
      font-family: Inter, Roboto, system-ui;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333;
    }

    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      padding: 12px 24px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }

    .wrap {
      background: rgba(255,255,255,0.7);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
      color: #555;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .buttons a {
      padding: 14px;
      text-decoration: none;
      background: white;
      border-radius: 10px;
      border: 1px solid rgba(33,150,243,0.3);
      color: var(--accent);
      font-weight: 600;
      transition: 0.2s;
    }

    .buttons a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="#" class="nav-logo">
      <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
      <span>IGC HK Exam</span>
    </a>
  </nav>

  <div class="container">
    <div class="wrap">

      <h1>Welcome to IGC HK Exam</h1>
      <p>Select a mock paper below to begin your revision.</p>

      <div class="buttons">
        <a href="https://ccoex.igchkshop.dpdns.org/mock1.html">Go to Mock 1</a>
        <a href="https://ccoex.igchkshop.dpdns.org/mock2.html">Go to Mock 2</a>
        <a href="https://ccoex.igchkshop.dpdns.org/mock3.html">Go to Mock 3</a>
      </div>

    </div>
  </div>

</body>
</html>
