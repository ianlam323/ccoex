<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>IGC HK Exam - WJEC</title>
  <style>
    :root{
      --bg:#fff8f0;
      --card:#fff5e6;
      --accent:#2196f3;
      --muted:#666666;
      --radius:12px;
      font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    }
    html,body{height:100%;margin:0;padding:0;background:linear-gradient(180deg,#ffecd2 0%,#ffd8a8 100%);}
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:28px;
      box-sizing:border-box;
    }
    .card{
      width:100%;
      max-width:820px;
      background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(255,255,255,0.8));
      border-radius:16px;
      box-shadow:0 12px 30px rgba(0,0,0,0.12);
      padding:36px;
      border:1px solid rgba(255,255,255,0.6);
      text-align:center;
    }
    .brand {
      display:flex;
      align-items:center;
      gap:14px;
      justify-content:center;
      margin-bottom:18px;
    }
    .brand .logo {
      width:48px;
      height:48px;
      border-radius:8px;
      background:linear-gradient(135deg,var(--accent),#7c4dff);
      color:#fff;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      box-shadow:0 6px 18px rgba(33,150,243,0.15);
      font-size:16px;
    }
    h1{
      margin:0 0 8px 0;
      font-size:20px;
      color:#222;
    }
    p.lead{
      margin:0 0 22px 0;
      color:var(--muted);
      font-size:14px;
    }
    .message {
      background:var(--card);
      border-radius:12px;
      padding:22px;
      border-left:4px solid var(--accent);
      color:#333;
      font-size:16px;
      line-height:1.5;
    }
    .actions{
      margin-top:20px;
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
    }
    a.btn{
      display:inline-block;
      text-decoration:none;
      padding:10px 16px;
      border-radius:10px;
      background:var(--accent);
      color:#fff;
      font-weight:600;
      box-shadow:0 8px 18px rgba(33,150,243,0.12);
    }
    a.secondary{
      background:transparent;
      color:var(--muted);
      border:1px solid rgba(0,0,0,0.06);
    }
    footer.small{
      margin-top:18px;
      color:var(--muted);
      font-size:13px;
    }
    @media (max-width:480px){
      .card{padding:20px}
      h1{font-size:18px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="region" aria-labelledby="title">
      <div class="brand" aria-hidden="false">
        <div class="logo" aria-hidden="true">IGC</div>
        <div>
          <h1 id="title">IGC HK Exam - WJEC</h1>
          <p class="lead">Mock 1 announcement</p>
        </div>
      </div>

      <div class="message" role="status" aria-live="polite">
        <strong>Mock 1 is over — thank you for your support.</strong>
        <p style="margin-top:10px;">
          The service has been terminated for now and will resume for Mock 2.
          We appreciate your hard work and look forward to seeing you for the next mock exam.
        </p>
      </div>

      <div class="actions" role="navigation" aria-label="site actions">
        <a class="btn" href="https://www.igchkshop.dpdns.org" target="_blank" rel="noopener">Visit Home</a>
        <a class="btn secondary" href="#" onclick="window.location.reload(); return false;">Refresh</a>
      </div>

      <footer class="small" aria-hidden="true">
        © <span id="year"></span> IGC HK Exam — WJEC
      </footer>
    </div>
  </div>

  <script>
    // set current year in footer
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
