<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam | Login</title>
  <link rel="icon" type="image/x-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
  <link rel="apple-touch-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
  
  <style>
    :root {
      --bg: #fff8f0;
      --card: #fff5e6;
      --muted: #666666;
      --accent: #2196f3;
      --physics: #ff5722;
      --chemistry: #4caf50;
      --biology: #9c27b0;
      --maths: #0077cc;
      --radius: 12px;
      font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }
    .nav-title {
      font-weight: 600;
      color: #333;
    }

    /* Login Container */
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 28px;
    }

    .login-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box; /* FIX: Ensures padding is included in width */
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    /* ===== MODIFICATION 1: Updated Logo ===== */
    .logo-image {
      width: 100px;
      height: auto;
      margin: 0 auto 20px;
      display: block;
      border-radius: 10px;
    }

    .login-header h1 {
      color: #333;
      margin-bottom: 8px;
      font-size: 28px;
    }

    .login-header p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Form Styles - FIXED WIDTH ISSUE */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
      font-size: 14px;
    }

    .form-control {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 10px;
      font-size: 15px;
      background: white;
      transition: all 0.2s ease;
      box-sizing: border-box; /* FIX: Critical fix for width calculation */
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #7c4dff);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 15px; /* Added for FAQ link spacing */
      box-sizing: border-box; /* FIX: Ensures proper width calculation */
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(33, 150, 243, 0.3);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* FAQ Link Below Sign In Button - NEW ADDITION */
    .faq-text-link {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    
    .faq-text-link a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    
    .faq-text-link a:hover {
      text-decoration: underline;
      color: #1976d2;
    }
    
    .faq-text-link .faq-icon {
      font-size: 12px;
    }

    /* Error Message */
    .error-message {
      background: rgba(255, 87, 34, 0.1);
      color: #ff5722;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      border: 1px solid rgba(255, 87, 34, 0.2);
      display: none;
    }

    .error-message.show {
      display: block;
    }

    /* Loading Spinner */
    .loading {
      display: none;
      text-align: center;
      margin-bottom: 20px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid rgba(33, 150, 243, 0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Refresh Button (shows after 8 seconds) - NEW ADDITION */
    .refresh-button-container {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .refresh-button-container.show {
      display: block;
    }

    .refresh-button {
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(0,0,0,0.1);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .refresh-button:hover {
      background: rgba(0,0,0,0.03);
      border-color: var(--accent);
      color: var(--accent);
    }

    .refresh-button:active {
      transform: translateY(1px);
    }

    /* FAQ Link Button - Floating Button */
    .faq-link {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(33, 150, 243, 0.1);
      color: var(--accent);
      border: 1px solid rgba(33, 150, 243, 0.3);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
      z-index: 100;
    }
    
    .faq-link:hover {
      background: rgba(33, 150, 243, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(33, 150, 243, 0.15);
    }
    
    .faq-link:active {
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 600px) {
      .login-container {
        padding: 20px 15px;
      }
      
      .login-card {
        padding: 30px 20px;
        max-width: 100%;
      }
      
      .login-header h1 {
        font-size: 24px;
      }
      
      .logo-image {
        width: 80px;
      }
      
      .faq-link {
        bottom: 15px;
        right: 15px;
        padding: 6px 12px;
        font-size: 12px;
      }
      
      .form-control {
        padding: 12px 14px;
      }
      
      .login-btn {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <a href="https://ccoex.igchkshop.dpdns.org" class="nav-logo">
      <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
      <span class="nav-title">IGC HK Exam</span>
    </a>
  </nav>

  <!-- Login Form -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <!-- ===== MODIFICATION 1: Logo Image ===== -->
        <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" alt="IGC HK Exam Logo" class="logo-image">
        
        <!-- ===== MODIFICATION 2: Updated Heading ===== -->
        <h1>Welcome to IGC HK Exam - WJEC</h1>
        
        <!-- ===== MODIFICATION 3: Updated Description ===== -->
        <p>Sign in to access exam resources. IGC HK Exam is only available by invitation only.</p>
        <p>If you are signed in, please wait for a while.</p>
      </div>

      <div id="errorMessage" class="error-message"></div>
      
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Signing in...</p>
        <!-- Refresh Button Container - NEW ADDITION -->
        <div id="refreshButtonContainer" class="refresh-button-container">
          <button id="refreshButton" class="refresh-button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M23 4V10H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1 20V14H7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3.51 9C4.15839 7.13077 5.38734 5.52429 7.01166 4.41284C8.63598 3.30139 10.5677 2.73956 12.5157 2.80243C14.4637 2.86531 16.3564 3.55001 17.8961 4.75476C19.4359 5.95951 20.5462 7.62344 21.07 9.5M1 14C1.64639 15.8692 2.87534 17.4757 4.49966 18.5872C6.12398 19.6986 8.05571 20.2604 10.0037 20.1976C11.9517 20.1347 13.8444 19.45 15.3841 18.2452C16.9239 17.0405 18.0342 15.3766 18.558 13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Stuck? Refresh Page
          </button>
        </div>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            class="form-control" 
            placeholder="Enter your email" 
            required
            autocomplete="username"
          >
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter your password" 
            required
            autocomplete="current-password"
          >
        </div>
        
        <button type="submit" class="login-btn" id="loginBtn">
          Sign In
        </button>
        
        <!-- FAQ Link Below Sign In Button - NEW ADDITION -->
        <div class="faq-text-link">
          <a href="faq.html">
            <span class="faq-icon">❓</span>
            Have questions? Visit our FAQ page for answers
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- FAQ Link Button - Floating Button -->
  <a href="faq.html" class="faq-link">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
      <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40913C11.0108 7.05016 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52152 14.2151 8.06353C14.6713 8.60553 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 17H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    FAQ
  </a>

  <!-- Firebase Authentication -->
  <script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
    
    // Your Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDV-pbFNyXTS6LMuzvSKbZnGysPOrZldcc",
      authDomain: "igc-hk.firebaseapp.com",
      projectId: "igc-hk",
      storageBucket: "igc-hk.firebasestorage.app",
      messagingSenderId: "1021412241243",
      appId: "1:1021412241243:web:f5cb650b2ad46fafa7f47e",
      measurementId: "G-EYW84F5CSY"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    // Check if user is already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // ===== MODIFICATION 4: REDIRECT USER LINK HERE =====
        window.location.href = "index.html"; // CHANGE FOR REDIRECT
      }
    });
    
    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorMessage = document.getElementById('errorMessage');
      const loading = document.getElementById('loading');
      const refreshButtonContainer = document.getElementById('refreshButtonContainer');
      
      // Reset error message
      errorMessage.textContent = '';
      errorMessage.classList.remove('show');
      
      // Reset refresh button
      refreshButtonContainer.classList.remove('show');
      
      // Show loading state
      loginBtn.disabled = true;
      loading.classList.add('show');
      
      // Set timeout to show refresh button after 8 seconds
      const refreshTimeout = setTimeout(() => {
        refreshButtonContainer.classList.add('show');
      }, 8000);
      
      try {
        // Sign in with Firebase
        await signInWithEmailAndPassword(auth, email, password);
        
        // Clear the timeout if login succeeds quickly
        clearTimeout(refreshTimeout);
        refreshButtonContainer.classList.remove('show');
        
        // Success - redirect will happen automatically via auth state listener
        
      } catch (error) {
        // Clear the timeout on error
        clearTimeout(refreshTimeout);
        refreshButtonContainer.classList.remove('show');
        
        // Handle errors
        loading.classList.remove('show');
        loginBtn.disabled = false;
        
        let message = 'Login failed. Please try again.';
        
        switch(error.code) {
          case 'auth/user-not-found':
            message = 'No account found with this email.';
            break;
          case 'auth/wrong-password':
            message = 'Incorrect password. Please try again.';
            break;
          case 'auth/invalid-email':
            message = 'Invalid email address.';
            break;
          case 'auth/user-disabled':
            message = 'This account has been disabled.';
            break;
          case 'auth/too-many-requests':
            message = 'Too many failed attempts. Please try again later.';
            break;
          case 'auth/network-request-failed':
            message = 'Network error. Please check your connection.';
            break;
        }
        
        errorMessage.textContent = message;
        errorMessage.classList.add('show');
        
        // Clear password field
        document.getElementById('password').value = '';
      }
    });
    
    // Handle refresh button click
    document.getElementById('refreshButton').addEventListener('click', function() {
      location.reload();
    });
    
    // Auto-focus email field on page load
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('email').focus();
    });
    
    // Enter key support
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
