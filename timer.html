<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WJEC Exam Timer</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#d8d8d8;
}

/* ========================= */
/* SETUP SCREEN */
/* ========================= */

.setup-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.setup-box{
    width:700px;
    background:white;
    padding:40px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

.setup-title{
    font-size:38px;
    font-weight:bold;
    margin-bottom:30px;
    text-align:center;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-grid input,
.form-grid select{
    padding:16px;
    font-size:18px;
    border:2px solid #777;
    width:100%;
    box-sizing:border-box;
}

.full-width{
    grid-column:1 / -1;
}

.example-text{
    margin-top:6px;
    color:#666;
    font-size:14px;
}

.start-btn{
    margin-top:30px;
    width:100%;
    padding:18px;
    font-size:24px;
    font-weight:bold;
    background:#111;
    color:white;
    border:none;
    cursor:pointer;
}

.start-btn:hover{
    background:#333;
}

/* ========================= */
/* EXAM SCREEN */
/* ========================= */

.exam-screen{
    display:none;
    justify-content:center;
    padding:30px;
}

.paper{
    width:950px;
    background:white;
    padding:40px;
    box-shadow:0 0 20px rgba(0,0,0,0.25);
}

.top-grid{
    display:grid;
    grid-template-columns:1fr 120px 120px;
    gap:10px;
    margin-bottom:30px;
}

.box{
    border:2px solid #777;
    height:55px;
    padding:8px;
    box-sizing:border-box;
}

.box-title{
    font-size:13px;
}

.logo-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logo{
    height:120px;
    object-fit:contain;
}

/* Larger IGC HK Logo */

.logo:last-child{
    height:170px;
}

.centre{
    text-align:center;
}

.level{
    font-size:36px;
    font-weight:bold;
}

.paper-code{
    font-size:28px;
    margin-top:8px;
}

.date-box{
    display:inline-block;
    border:3px solid #666;
    background:#ddd;
    padding:8px 18px;
    font-weight:bold;
    font-size:26px;
    margin-top:10px;
}

.subject{
    font-size:42px;
    font-weight:bold;
    margin-top:25px;
}

.subtitle{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}

.duration{
    font-size:28px;
    margin-top:15px;
}

.timer{
    margin-top:40px;
    text-align:center;
    font-size:110px;
    font-weight:bold;
    border:5px solid black;
    padding:30px;
    background:#f4f4f4;
    letter-spacing:5px;
}

.timer-controls{
    margin-top:30px;
    display:flex;
    gap:15px;
}

.timer-controls button{
    flex:1;
    padding:16px;
    font-size:22px;
    font-weight:bold;
    background:#111;
    color:white;
    border:none;
    cursor:pointer;
}

.timer-controls button:hover{
    background:#333;
}

</style>
</head>

<body>

<!-- ========================= -->
<!-- SETUP SCREEN -->
<!-- ========================= -->

<div class="setup-screen" id="setupScreen">

    <div class="setup-box">

        <div class="setup-title">
            WJEC Exam Timer Setup
        </div>

        <div class="form-grid">

            <!-- SUBJECT -->

            <div class="full-width">

                <input
                    type="text"
                    id="subjectInput"
                    placeholder="Subject / Component Name"
                >

                <div class="example-text">
                    Example: PHYSICS – A level component 2
                </div>

            </div>

            <!-- SUBTITLE -->

            <div class="full-width">

                <input
                    type="text"
                    id="subtitleInput"
                    placeholder="Subtitle"
                >

                <div class="example-text">
                    Example: Electricity and the Universe
                </div>

            </div>

            <!-- PAPER CODE -->

            <div class="full-width">

                <input
                    type="text"
                    id="paperCodeInput"
                    placeholder="Paper Code"
                >

                <div class="example-text">
                    Example: A420U20-1
                </div>

            </div>

            <!-- DATE -->

            <div>

                <input
                    type="date"
                    id="dateInput"
                >

                <div class="example-text">
                    Select Exam Date
                </div>

            </div>

            <!-- SESSION -->

            <div>

                <select id="sessionInput">

                    <option value="">
                        Select Session
                    </option>

                    <option>
                        MORNING
                    </option>

                    <option>
                        AFTERNOON
                    </option>

                </select>

                <div class="example-text">
                    Morning or Afternoon Paper
                </div>

            </div>

            <!-- HOURS -->

            <div>

                <input
                    type="number"
                    id="hoursInput"
                    placeholder="Hours"
                >

                <div class="example-text">
                    Example: 2
                </div>

            </div>

            <!-- MINUTES -->

            <div>

                <input
                    type="number"
                    id="minutesInput"
                    placeholder="Minutes"
                >

                <div class="example-text">
                    Example: 30
                </div>

            </div>

        </div>

        <button class="start-btn" onclick="startExam()">
            Generate Exam Timer
        </button>

    </div>

</div>

<!-- ========================= -->
<!-- EXAM SCREEN -->
<!-- ========================= -->

<div class="exam-screen" id="examScreen">

    <div class="paper">

        <div class="top-grid">

            <div class="box">
                <div class="box-title">Surname</div>
            </div>

            <div class="box">
                <div class="box-title">Centre Number</div>
            </div>

            <div class="box">
                <div class="box-title">Candidate Number</div>
            </div>

        </div>

        <div class="logo-row">

            <!-- WJEC LOGO -->

            <img
                class="logo"
                src="https://upload.wikimedia.org/wikipedia/en/thumb/9/94/WJEC_CBAC_logo.svg/250px-WJEC_CBAC_logo.svg.png"
            >

            <!-- CENTRE -->

            <div class="centre">

                <div class="level">
                    GCE A LEVEL
                </div>

                <div class="paper-code" id="paperCodeDisplay"></div>

            </div>

            <!-- IGC HK EXAM LOGO -->

            <img
                class="logo"
                src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg"
            >

        </div>

        <!-- DATE -->

        <div style="text-align:center;">

            <div class="date-box" id="dateDisplay"></div>

        </div>

        <!-- SUBJECT -->

        <div class="subject" id="subjectDisplay"></div>

        <!-- SUBTITLE -->

        <div class="subtitle" id="subtitleDisplay"></div>

        <!-- DURATION -->

        <div class="duration" id="durationDisplay"></div>

        <!-- TIMER -->

        <div class="timer" id="timer">
            00:00:00
        </div>

        <!-- CONTROLS -->

        <div class="timer-controls">

            <button onclick="startTimer()">
                Start
            </button>

            <button onclick="pauseTimer()">
                Pause
            </button>

            <button onclick="resetTimer()">
                Reset
            </button>

        </div>

    </div>

</div>

<script>

let totalSeconds = 0;
let originalSeconds = 0;
let timerInterval = null;

/* ========================= */
/* FORMAT TIME */
/* ========================= */

function formatTime(seconds){

    let hrs = Math.floor(seconds / 3600);
    let mins = Math.floor((seconds % 3600) / 60);
    let secs = seconds % 60;

    return String(hrs).padStart(2,'0') + ":" +
           String(mins).padStart(2,'0') + ":" +
           String(secs).padStart(2,'0');
}

/* ========================= */
/* GENERATE SCREEN */
/* ========================= */

function startExam(){

    let subject =
        document.getElementById("subjectInput").value;

    let subtitle =
        document.getElementById("subtitleInput").value;

    let paperCode =
        document.getElementById("paperCodeInput").value;

    let date =
        document.getElementById("dateInput").value;

    let session =
        document.getElementById("sessionInput").value;

    let hours =
        parseInt(document.getElementById("hoursInput").value) || 0;

    let minutes =
        parseInt(document.getElementById("minutesInput").value) || 0;

    if(!subject || !paperCode || !date || !session){

        alert("Please fill in all required fields.");

        return;
    }

    let dateObj = new Date(date);

    let formattedDate =
        dateObj.toLocaleDateString('en-GB', {
            weekday:'long',
            day:'numeric',
            month:'long',
            year:'numeric'
        }).toUpperCase();

    document.getElementById("subjectDisplay").innerText =
        subject;

    document.getElementById("subtitleDisplay").innerText =
        subtitle;

    document.getElementById("paperCodeDisplay").innerText =
        paperCode;

    document.getElementById("dateDisplay").innerText =
        formattedDate + " — " + session;

    document.getElementById("durationDisplay").innerText =
        hours + " hr " + minutes + " min";

    totalSeconds = (hours * 3600) + (minutes * 60);

    originalSeconds = totalSeconds;

    updateTimerDisplay();

    document.getElementById("setupScreen").style.display =
        "none";

    document.getElementById("examScreen").style.display =
        "flex";
}

/* ========================= */
/* TIMER */
/* ========================= */

function updateTimerDisplay(){

    document.getElementById("timer").innerText =
        formatTime(totalSeconds);
}

function startTimer(){

    if(timerInterval) return;

    timerInterval = setInterval(() => {

        if(totalSeconds > 0){

            totalSeconds--;

            updateTimerDisplay();

        }else{

            clearInterval(timerInterval);

            timerInterval = null;

            alert("Exam Finished");

        }

    },1000);
}

function pauseTimer(){

    clearInterval(timerInterval);

    timerInterval = null;
}

function resetTimer(){

    clearInterval(timerInterval);

    timerInterval = null;

    totalSeconds = originalSeconds;

    updateTimerDisplay();
}

</script>

</body>
</html>
