<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGC HK Exam Dashboard</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #fdf4e6;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
    }

    .subject-card {
        background: #fff7ec;
        margin: 20px 0;
        padding: 20px;
        border-radius: 16px;
        border: 1px solid #f0e0c9;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .subject-header {
        display: flex;
        align-items: center; /* ensures icon + title align */
        gap: 14px;
        margin-bottom: 16px;
    }

    /* --- FIXED ICON ALIGNMENT --- */
    .subject-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        display: flex;
        align-items: center;      /* perfect vertical centering */
        justify-content: center;  /* perfect horizontal centering */
        color: white;
        font-weight: bold;
        font-size: 18px;
        flex-shrink: 0; /* prevents icon from shrinking */
    }

    /* --- FIXED BUTTON ALIGNMENT --- */
    .links a {
        display: block;
        width: calc(100% - 4px); /* ensures perfect margin */
        margin: 0 auto 12px auto; /* centers + spacing */
        padding: 12px 14px;
        text-decoration: none;
        background: white;
        border-radius: 12px;
        border: 1px solid rgba(33,150,243,0.25);
        color: #1a73e8;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        transition: 0.2s;
    }

    .links a:hover {
        transform: translateY(-2px);
        box-shadow: 0 3px 8px rgba(0,0,0,0.10);
    }

    /* Mock 1 button at bottom */
    .bottom-button {
        text-align: center;
        margin-top: 40px;
    }

    .bottom-button a {
        padding: 12px 18px;
        display: inline-block;
        background: #fff;
        border-radius: 10px;
        border: 1px solid #ddd;
        color: #1a73e8;
        font-weight: bold;
        text-decoration: none;
        transition: 0.2s;
    }

    .bottom-button a:hover {
        transform: translateY(-2px);
    }
</style>
</head>

<body>

<h1>IGC HK Exam Materials</h1>

<!-- PHYSICS -->
<div class="subject-card">
    <div class="subject-header">
        <div class="subject-icon" style="background:#ef6c3d;">P</div>
        <h2>Physics</h2>
    </div>
    <div class="links">
        <a href="#">IGC HK Exam Paper – Physics (QP)</a>
        <a href="#">Mark Scheme</a>
    </div>
</div>

<!-- CHEMISTRY -->
<div class="subject-card">
    <div class="subject-header">
        <div class="subject-icon" style="background:#42a5f5;">C</div>
        <h2>Chemistry</h2>
    </div>
    <div class="links">
        <a href="#">IGC HK Exam Paper – Chemistry (QP)</a>
        <a href="#">Mark Scheme</a>
    </div>
</div>

<!-- BIOLOGY -->
<div class="subject-card">
    <div class="subject-header">
        <div class="subject-icon" style="background:#66bb6a;">B</div>
        <h2>Biology</h2>
    </div>
    <div class="links">
        <a href="#">IGC HK Exam Paper – Biology (QP)</a>
        <a href="#">Mark Scheme</a>
    </div>
</div>

<!-- MATH -->
<div class="subject-card">
    <div class="subject-header">
        <div class="subject-icon" style="background:#ab47bc;">M</div>
        <h2>Mathematics</h2>
    </div>
    <div class="links">
        <a href="#">IGC HK Exam Paper – Maths (QP)</a>
        <a href="#">Mark Scheme</a>
    </div>
</div>

<!-- Mock 1 Button -->
<div class="bottom-button">
    <a href="https://ccoex.igchkshop.dpdns.org/mock1">Go to Mock 1 Content</a>
</div>

</body>
</html>
