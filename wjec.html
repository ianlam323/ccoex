<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam - Home</title>
  <link rel="icon" type="image/x-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexampure.jpg">
  <link rel="apple-touch-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexampure.jpg">

  <style>
    :root {
      --bg: #fff8f0;
      --card: #fff5e6;
      --accent: #2196f3;
      --radius: 12px;
      font-family: Inter, Roboto, system-ui;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333;
    }

    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      padding: 12px 24px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }

    .wrap {
      background: rgba(255,255,255,0.7);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .main-logo {
      width: 50px;
      height: 50px;
      border-radius: 8px;
    }

    h1 {
      margin: 0;
    }

    p {
      margin-bottom: 30px;
      color: #555;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .buttons a {
      padding: 14px;
      text-decoration: none;
      background: white;
      border-radius: 10px;
      border: 1px solid rgba(33,150,243,0.3);
      color: var(--accent);
      font-weight: 600;
      transition: 0.2s;
    }

    .buttons a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }
    
    /* Style for the last updated section */
    .update-info {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,0,0,0.1);
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="#" class="nav-logo">
      <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" alt="Logo">
      <span>IGC HK Exam</span>
    </a>
  </nav>

  <div class="container">
    <div class="wrap">

      <header>
        <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" class="main-logo" alt="Main Logo">
        <h1>WJEC Exam Material</h1>
      </header>

      <div class="buttons">
        <a href="https://ccoex.igchkshop.dpdns.org/wjec/phy.pdf">Physics Formula Booklet</a>
        <a href="https://ccoex.igchkshop.dpdns.org/wjec/chem.pdf">Chemistry Data Booklet</a>
        <a href="https://ccoex.igchkshop.dpdns.org/wjec/maths.pdf">Maths Formula Booklet</a>
        <a href="https://ccoex.igchkshop.dpdns.org/wjec/maths_stat.pdf">Maths Statistical Table</a>

      </div>



</body>
</html>
