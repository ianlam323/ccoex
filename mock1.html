<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam - WJEC Mock 1 Complete</title>
  <style>
    :root {
      --accent: #2196f3;
      --bg: #fff8f0;
      --card: #fff5e6;
      --muted: #666666;
      --radius: 14px;
      font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Navigation Bar */
    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .nav-title {
      font-weight: 600;
      color: #333;
      font-size: 16px;
    }

    /* Banner */
    .banner {
      background: linear-gradient(90deg, #4CAF50, #2196F3);
      color: white;
      text-align: center;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.3px;
      animation: fadeIn 1s ease-in-out;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Main content */
    .container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-direction: column;
      padding: 40px 20px;
    }

    .card {
      background: var(--card);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
      animation: fadeIn 1.2s ease;
    }

    .card h1 {
      margin-top: 0;
      font-size: 24px;
      color: #333;
    }

    .card p {
      color: var(--muted);
      font-size: 15px;
      margin: 15px 0 30px 0;
      line-height: 1.6;
    }

    /* Button */
    .button {
      display: inline-block;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(33,150,243,0.3);
    }
    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 18px rgba(33,150,243,0.4);
    }

    footer {
      text-align: center;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
      background: rgba(255,255,255,0.8);
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    @media (max-width: 600px) {
      .card {
        padding: 30px 20px;
      }
      .card h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="https://www.igchkshop.dpdns.org" class="nav-logo">
      <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" alt="IGC HK Exam Logo">
      <span class="nav-title">IGC HK Exam</span>
    </a>
  </nav>

  <!-- Congratulations Banner -->
  <div class="banner">
    🎉 Congratulations! The exam is over. 🎉
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="card">
      <h1>Mock 1 is Over</h1>
      <p>Thank you for your support throughout the exam period. The service has now terminated and will reopen when Mock 2 begins. We appreciate your hard work and dedication!</p>
      <a href="https://ccoex.igchkshop.dpdns.org/mock1" class="button">Review Mock 1 Content</a>
    </div>
  </div>

  <footer>
    © 2025 IGC HK Exam — All rights reserved.
  </footer>

</body>
</html>
