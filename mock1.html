<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGC HK Exam - WJEC Past Paper Bank</title>
  <link rel="icon" type="image/x-icon" href="https://www2.igchkshop.dpdns.org/img/igchkexampure.jpg">
  
  <style>
    :root {
      --bg: #fff8f0;
      --card: #fff5e6;
      --muted: #666666;
      --accent: #2196f3;
      --physics: #ff5722;
      --chemistry: #4caf50;
      --biology: #9c27b0;
      --radius: 12px;
      font-family: Inter, Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(180deg, #ffecd2 0%, #ffd8a8 100%);
      color: #333333;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Navigation Bar */
    .navbar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-logo img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .nav-title {
      font-weight: 600;
      color: #333;
      font-size: 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px;
    }

    .wrap {
      background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.5));
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 28px;
      border: 1px solid rgba(255,255,255,0.5);
      margin-bottom: 28px;
    }

    header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #7c4dff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      box-shadow: 0 6px 18px rgba(33,150,243,0.2);
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    p.lead {
      margin: 4px 0 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .header-image {
      width: 100px;
      border-radius: 10px;
      margin: 10px 0 20px 0;
    }

    .instructions {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 28px;
      border-left: 4px solid var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
    }

    .subject-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(0,0,0,0.05);
    }

    .subject-header {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .subject-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .physics-icon { background: var(--physics); }
    .chemistry-icon { background: var(--chemistry); }
    .biology-icon { background: var(--biology); }

    .links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .links a {
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 10px;
      color: var(--accent);
      border: 1px solid rgba(33,150,243,0.2);
      font-size: 12px;
      font-weight: 600;
    }

    /* ✅ NEW UNIFIED BUTTON */
    .mock-button {
      text-align: center;
      margin-top: 40px;
    }

    .mock-button a {
      text-decoration: none;
      background: linear-gradient(135deg, #ff5722, #ff8a65);
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }

    .mock-button a:hover {
      transform: translateY(-3px);
    }

    footer {
      margin-top: 28px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>

<nav class="navbar">
  <a href="https://ccoex.igchkshop.dpdns.org" class="nav-logo">
    <img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg">
    <span class="nav-title">IGC HK Exam</span>
  </a>
</nav>

<div class="container">
<div class="wrap">

<header>
  <div class="logo">IGC</div>
  <div>
    <h1>IGC HK Exam - WJEC Past Paper Bank</h1>
    <p class="lead">Access past papers and revision resources</p>
  </div>
</header>

<img src="https://www2.igchkshop.dpdns.org/img/igchkexam.jpg" class="header-image">

<section class="grid">

<div class="subject-card">
  <div class="subject-header">
    <div class="subject-icon physics-icon">P</div>
    <h2>Physics</h2>
  </div>
</div>

<div class="subject-card">
  <div class="subject-header">
    <div class="subject-icon chemistry-icon">C</div>
    <h2>Chemistry</h2>
  </div>
</div>

<div class="subject-card">
  <div class="subject-header">
    <div class="subject-icon biology-icon">B</div>
    <h2>Biology</h2>
  </div>
</div>

</section>

<!-- ✅ Buttons -->
<div class="mock-button">
  <a href="https://ccoex.igchkshop.dpdns.org/mock2.html">
    ➡️ Go to Mock 2 Papers
  </a>
</div>

<div class="mock-button">
  <a href="https://ccoex.igchkshop.dpdns.org/mock3.html">
    ➡️ Go to Mock 3 Papers
  </a>
</div>

<footer>
  <div>Tip: Open links in new tab</div>
  <div>2025</div>
</footer>

</div>
</div>

</body>
</html>
